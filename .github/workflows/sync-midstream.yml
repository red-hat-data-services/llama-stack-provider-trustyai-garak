name: Sync midstream main

# Pulls opendatahub-io (ODH) main into main as a pull request. ODH main itself
# is synced from trustyai-explainability main by ODH's sync-upstream.yml, which
# also arrives here through this sync but only runs in opendatahub-io.
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: ${{ github.repository == 'red-hat-data-services/llama-stack-provider-trustyai-garak' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: sync-midstream-main-into-main
      cancel-in-progress: false
    steps:
      - name: Sync opendatahub-io/llama-stack-provider-trustyai-garak main into main
        uses: ruivieira/basic-ops-tasks@cdb560bd992944ab5ab656d6e8dbc0aa85bbb211 # v1.0.0
        with:
          upstream-repo: opendatahub-io/llama-stack-provider-trustyai-garak
          upstream-branch: main
          target-branch: main
          merge-strategy: merge
          # This sync/ branch is automation-owned; reuse it after its PR merges.
          allow-head-update: true
          fail-on-conflict: true
          labels: bot/sync-midstream
