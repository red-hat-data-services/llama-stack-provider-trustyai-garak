name: Validate Dependencies

on:
  pull_request:
    branches: [main, 'rhoai-*']
  push:
    branches: [main, 'rhoai-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locked-dependencies:
    name: Locked Dependency Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select the Linux x86_64 lock file
        id: lockfile
        run: |
          for file in requirements.txt requirements-x86_64.txt; do
            if [ -f "$file" ]; then
              echo "path=$file" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No supported dependency lock file exists."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ steps.lockfile.outputs.path }}

      - name: Install locked dependencies
        env:
          LOCK_FILE: ${{ steps.lockfile.outputs.path }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$LOCK_FILE"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Validate project extras against locked dependencies
        run: |
          python -m pip install \
            --dry-run \
            --no-index \
            --no-build-isolation \
            ".[inline]"
